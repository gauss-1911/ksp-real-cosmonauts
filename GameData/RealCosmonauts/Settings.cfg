REAL_COSMONAUTS_SETTINGS
{
	// Developer tool: write a report of every Kerbal model (bones, meshes, materials,
	// animations) to GameData/RealCosmonauts/PluginData/KerbalDump/ when the main menu
	// loads, and again the first time a flight starts.
	dumpKerbalModels = false

	// Developer tool: also export each Kerbal mesh as an .obj file next to the report.
	exportMeshes = false

	// Master switch for replacing Kerbal meshes with the mod's models.
	replaceModels = true

	// Prototype: size of the human head relative to a real human head (1 = real size).
	headScale = 1.0

	// Head models from Models/ (without .rcm) for male and female Kerbals.
	maleHead = male_a
	femaleHead = female_a
}
